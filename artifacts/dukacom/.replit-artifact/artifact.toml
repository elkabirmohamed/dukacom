kind = "web"
previewPath = "/"
title = "DukaCom"
version = "1.0.0"
id = "artifacts/dukacom"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23414

[services.development]
run = "pnpm --filter @workspace/dukacom run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dukacom", "run", "build" ]
serve = "static"
publicDir = "artifacts/dukacom/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23414"
BASE_PATH = "/"
